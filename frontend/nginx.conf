server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    client_max_body_size 50m;
    # Docker's embedded DNS. Using a VARIABLE in proxy_pass forces nginx to
    # re-resolve at request time instead of caching the backend's IP at
    # startup — without this, every deploy that recreates the backend
    # container leaves nginx proxying to a dead IP and returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend http://backend:4000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
