<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP Club — Challenge the Pain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --accent: #0066cc;
    --accent-soft: rgba(0,102,204,0.08);
    --red: #ef4444;
    --green: #10b981;
    --amber: #f59e0b;
    --purple: #7c3aed;
    --radius: 18px;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── NAV ─────────────────────────────────── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 56px;
  }
  .nav-logo { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .nav-logo-text { font-size: 15px; font-weight: 900; letter-spacing: -0.4px; }
  .nav-logo-text span { font-weight: 300; letter-spacing: 2px; font-size: 12.75px; }
  .nav-pill {
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer; transition: 0.15s; text-decoration: none;
  }
  .nav-pill.active { background: #111; color: #fff; }
  .nav-pill:not(.active) { background: transparent; color: var(--muted); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* ─── PAGE WRAPPER ───────────────────────── */
  .page { max-width: 1160px; margin: 0 auto; padding: 36px 28px 80px; }

  /* ─── VIEWS ─────────────────────────────── */
  #view-feed { display: block; }
  #view-detail { display: none; }

  /* ─── FEED HEADER ─────────────────────────── */
  .feed-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  .feed-title { font-size: 26px; font-weight: 900; letter-spacing: -0.6px; }
  .feed-sub { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(239,68,68,0.09); color: var(--red);
    border: 1px solid rgba(239,68,68,0.18);
    border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ─── CHALLENGE GRID ─────────────────────── */
  .challenge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }

  /* ─── CHALLENGE CARD ─────────────────────── */
  .challenge-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px 20px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    display: flex; flex-direction: column; gap: 0;
    position: relative;
  }
  .challenge-card:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 32px rgba(0,102,204,0.1);
    transform: translateY(-2px);
  }
  .challenge-card.hot { border-color: rgba(239,68,68,0.35); }
  .challenge-card.hot:hover { border-color: var(--red); box-shadow: 0 6px 32px rgba(239,68,68,0.1); }

  .card-eyebrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .challenge-num { font-size: 11px; font-weight: 800; color: var(--faint); letter-spacing: 0.8px; text-transform: uppercase; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 20px; padding: 3px 10px; font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .status-live { background: rgba(239,68,68,0.09); color: var(--red); }
  .status-brewing { background: rgba(245,158,11,0.1); color: var(--amber); }
  .status-solved { background: rgba(16,185,129,0.1); color: var(--green); }

  .card-question {
    font-size: 17px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.35;
    margin-bottom: 16px; color: var(--text);
  }

  /* Progress bar */
  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .progress-track { flex: 1; height: 6px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .progress-pct { font-size: 12px; font-weight: 800; color: var(--text); }

  /* Stats row */
  .stats-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat-val { font-size: 16px; font-weight: 800; color: var(--text); }
  .stat-lbl { font-size: 10px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.4px; }

  /* Tension strip */
  .tension-strip {
    background: linear-gradient(90deg, rgba(0,102,204,0.06) 0%, rgba(239,68,68,0.06) 100%);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
    font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.5;
  }
  .tension-vs { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .tension-a { color: var(--accent); font-weight: 800; font-size: 13px; }
  .tension-b { color: var(--red); font-weight: 800; font-size: 13px; }
  .tension-divider { flex: 1; height: 1px; background: var(--border); }
  .tension-mid { font-size: 10px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }

  /* Card footer */
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .experts-row { display: flex; }
  .expert-avatar {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
    font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    margin-left: -6px; color: #fff;
  }
  .expert-avatar:first-child { margin-left: 0; }
  .expert-count { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 8px; }
  .view-btn { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: 0.2px; }

  /* ─── DETAIL VIEW ─────────────────────────── */
  .detail-back {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 24px;
    border: none; background: none; padding: 0;
  }
  .detail-back:hover { color: var(--text); }

  .detail-header {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 28px 32px; margin-bottom: 20px;
  }
  .detail-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .detail-num { font-size: 12px; font-weight: 800; color: var(--faint); letter-spacing: 0.8px; text-transform: uppercase; }
  .detail-question { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.3; margin-bottom: 20px; }

  /* Health bars */
  .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .health-item label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--faint); display: block; margin-bottom: 5px; }
  .health-track { height: 8px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
  .health-fill { height: 100%; border-radius: 99px; }

  .detail-stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .detail-stat { display: flex; flex-direction: column; gap: 2px; }
  .detail-stat-val { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
  .detail-stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }

  /* ─── AI GUIDE ───────────────────────────── */
  .ai-guide {
    background: linear-gradient(135deg, #0066cc 0%, #5b21b6 100%);
    border-radius: var(--radius); padding: 20px 24px; margin-bottom: 20px;
    color: #fff;
  }
  .ai-guide-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ai-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .ai-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.75; }
  .ai-message { font-size: 15px; font-weight: 600; line-height: 1.6; opacity: 0.95; margin-bottom: 14px; }
  .ai-questions { display: flex; flex-direction: column; gap: 7px; }
  .ai-q {
    background: rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 13px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .ai-q:hover { background: rgba(255,255,255,0.2); }
  .ai-q-arrow { font-size: 11px; margin-left: auto; opacity: 0.6; }

  /* ─── LAYOUT GRID ───────────────────────── */
  .detail-body { display: grid; grid-template-columns: 1fr 360px; gap: 20px; }

  /* ─── KNOWLEDGE TREE ─────────────────────── */
  .tree-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .tree-title {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px;
  }
  .tree-wrap { padding: 20px; overflow-x: auto; }

  /* Tree node styles */
  .tree { display: flex; flex-direction: column; gap: 0; }
  .tree-node {
    display: flex; flex-direction: column;
  }
  .node-row { display: flex; align-items: flex-start; gap: 0; }
  .node-line-wrap { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .node-vline { width: 2px; background: var(--border); flex: 1; min-height: 8px; }
  .node-hline { width: 18px; height: 2px; background: var(--border); margin-top: 16px; }
  .node-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 13px; }
  .node-box {
    margin-left: 8px; margin-bottom: 8px; border-radius: 10px; padding: 8px 12px;
    font-size: 12px; font-weight: 600; line-height: 1.4; cursor: pointer;
    border: 1.5px solid transparent; transition: 0.15s; flex: 1;
    display: flex; align-items: flex-start; gap: 7px;
  }
  .node-box:hover { transform: translateX(2px); }
  .node-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .node-text { flex: 1; }
  .node-pts { font-size: 10px; font-weight: 800; margin-top: 3px; opacity: 0.7; }

  .node-root { background: #111; color: #fff; border-color: #111; font-size: 13px; font-weight: 800; }
  .node-evidence { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); color: #064e3b; }
  .node-hypothesis { background: rgba(0,102,204,0.07); border-color: rgba(0,102,204,0.18); color: #1e3a5f; }
  .node-assumption { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); color: #78350f; }
  .node-question { background: rgba(124,58,237,0.07); border-color: rgba(124,58,237,0.18); color: #4c1d95; }
  .node-challenge { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.18); color: #7f1d1d; }
  .node-solution { background: rgba(59,130,246,0.07); border-color: rgba(59,130,246,0.18); color: #1e3a8a; }
  .node-outcome { background: #f3f4f6; border-color: var(--border); color: var(--muted); }

  .tree-children { margin-left: 28px; border-left: 2px solid var(--border); padding-left: 12px; }

  /* ─── SIDEBAR ─────────────────────────────── */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  /* Contribute palette */
  .palette-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .palette-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
  .palette-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .palette-grid { display: flex; flex-direction: column; gap: 7px; }
  .palette-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 11px;
    border: 1.5px solid var(--border); background: transparent;
    cursor: pointer; transition: 0.15s; text-align: left; width: 100%;
    font-family: inherit;
  }
  .palette-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .palette-icon { font-size: 16px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }
  .palette-btn-text { flex: 1; }
  .palette-btn-label { font-size: 12px; font-weight: 700; color: var(--text); display: block; }
  .palette-btn-pts { font-size: 10px; font-weight: 700; color: var(--green); display: block; margin-top: 1px; }
  .palette-btn-arrow { font-size: 11px; color: var(--faint); }

  /* Tension card */
  .tension-card {
    background: linear-gradient(135deg, rgba(0,102,204,0.05) 0%, rgba(239,68,68,0.05) 100%);
    border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
  }
  .tension-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--faint); margin-bottom: 10px; }
  .tension-question { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.5; }
  .tension-bars { display: flex; flex-direction: column; gap: 8px; }
  .tension-bar-row { display: flex; align-items: center; gap: 8px; }
  .tension-bar-label { font-size: 12px; font-weight: 700; width: 80px; flex-shrink: 0; }
  .tension-bar-track { flex: 1; height: 10px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
  .tension-bar-fill-a { height: 100%; background: var(--accent); border-radius: 99px; }
  .tension-bar-fill-b { height: 100%; background: var(--red); border-radius: 99px; }
  .tension-bar-pct { font-size: 12px; font-weight: 800; width: 32px; text-align: right; }
  .tension-cta { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--accent); text-align: center; padding: 8px; background: var(--accent-soft); border-radius: 9px; cursor: pointer; }

  /* Leaderboard card */
  .leaders-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .leaders-title { font-size: 13px; font-weight: 800; margin-bottom: 14px; }
  .leader-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .leader-avatar { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .leader-info { flex: 1; }
  .leader-name { font-size: 13px; font-weight: 700; }
  .leader-title { font-size: 11px; color: var(--accent); font-weight: 600; }
  .leader-pts { text-align: right; }
  .leader-pts-val { font-size: 14px; font-weight: 900; color: var(--text); }
  .leader-pts-lbl { font-size: 10px; color: var(--faint); font-weight: 600; display: block; }

  /* Reactions card */
  .reactions-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .reactions-title { font-size: 13px; font-weight: 800; margin-bottom: 14px; }
  .reaction-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 11px; cursor: pointer;
    transition: 0.15s; margin-bottom: 7px;
  }
  .reaction-row:hover { border-color: var(--accent); background: var(--accent-soft); }
  .reaction-icon { font-size: 18px; }
  .reaction-text { flex: 1; font-size: 12px; font-weight: 600; line-height: 1.4; }
  .reaction-count { font-size: 12px; font-weight: 800; color: var(--muted); }

  /* ─── CONTRIBUTION FEED ──────────────────── */
  .contrib-feed { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .contrib-item {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
  }
  .contrib-header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .contrib-avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contrib-meta { flex: 1; }
  .contrib-name { font-size: 12px; font-weight: 700; }
  .contrib-role { font-size: 10px; color: var(--accent); font-weight: 600; }
  .contrib-type-badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 20px; padding: 3px 9px; font-size: 10px; font-weight: 700;
  }
  .contrib-body { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 10px; }
  .contrib-footer { display: flex; align-items: center; justify-content: space-between; }
  .contrib-pts { font-size: 11px; font-weight: 800; color: var(--green); }
  .contrib-reactions { display: flex; gap: 6px; }
  .contrib-react-btn {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px;
    border: 1px solid var(--border); border-radius: 20px; font-size: 11px;
    background: transparent; cursor: pointer; transition: 0.15s; color: var(--muted);
    font-weight: 600;
  }
  .contrib-react-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ─── TOAST ──────────────────────────────── */
  #toast {
    position: fixed; bottom: 28px; right: 28px; z-index: 999;
    background: #111; color: #fff; border-radius: 14px; padding: 14px 20px;
    font-size: 14px; font-weight: 700; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    transform: translateY(20px); opacity: 0; transition: 0.25s;
    pointer-events: none;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  .toast-pts { color: #4ade80; }

  /* ─── RESPONSIVE ─────────────────────────── */
  @media (max-width: 900px) {
    .detail-body { grid-template-columns: 1fr; }
    .health-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="showFeed()">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="5.5" fill="#111827"/>
      <line x1="25" y1="16" x2="29" y2="16" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="25" x2="16" y2="29" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="16" x2="3" y2="16" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="7" x2="16" y2="3" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="nav-logo-text">MVP <span>CLUB</span></div>
  </div>
  <div style="display:flex;gap:4px">
    <a class="nav-pill active">Challenges</a>
    <a class="nav-pill">My Idea Vault</a>
    <a class="nav-pill">Network</a>
  </div>
  <div class="nav-right">
    <div style="font-size:12px;font-weight:700;color:var(--green)">⬡ 847 pts</div>
    <div class="avatar">ST</div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════ FEED VIEW -->
<div id="view-feed">
  <div class="page">

    <div class="feed-header">
      <div>
        <div class="feed-title">Active Challenges</div>
        <div class="feed-sub">Each is a live investigation. Join one and advance collective thinking.</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="live-badge"><div class="live-dot"></div>5 active now</div>
        <button onclick="openDetail(0)" style="padding:9px 18px;border-radius:20px;background:#111;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer">+ Post a Challenge</button>
      </div>
    </div>

    <div class="challenge-grid" id="challenge-grid"></div>

  </div>
</div>

<!-- ═══════════════════════════════════════════ DETAIL VIEW -->
<div id="view-detail">
  <div class="page">

    <button class="detail-back" onclick="showFeed()">← All Challenges</button>

    <div class="detail-header" id="detail-header"></div>

    <div class="ai-guide" id="ai-guide"></div>

    <div class="detail-body">
      <div>
        <!-- Knowledge Tree -->
        <div class="tree-card">
          <div class="tree-title">🌳 Investigation Tree <span style="font-size:11px;color:var(--faint);font-weight:600;margin-left:auto">Everything is connected. Nothing is just a comment.</span></div>
          <div class="tree-wrap" id="tree-wrap"></div>
        </div>
        <!-- Contribution feed -->
        <div class="contrib-feed" id="contrib-feed"></div>
      </div>

      <div class="detail-stat"><div class="detail-stat-val">${c.confidence}%</div><div class="detail-stat-lbl">Confidence level</div></div>
    </div>
  `;
}

function renderAiGuide(c) {
  const el = document.getElementById('ai-guide');
  el.innerHTML = `
    <div class="ai-guide-top">
      <div class="ai-icon">✦</div>
      <div><div class="ai-label">AI Facilitator</div><div style="font-size:13px;font-weight:700;opacity:0.9">Guiding collective thinking</div></div>
    </div>
    <div class="ai-message">${c.aiMessage}</div>
    <div class="ai-questions">
      ${c.aiQuestions.map(q => `<div class="ai-q" onclick="contributeAction('🔍 Ask a Question', q)">💬 ${q}<span class="ai-q-arrow">→</span></div>`).join('')}
    </div>
  `;
}

// ── TREE ───────────────────────────────────
function renderNode(node, depth = 0) {
  const typeMap = {
    root: 'node-root',
    evidence: 'node-evidence',
    hypothesis: 'node-hypothesis',
    assumption: 'node-assumption',
    question: 'node-question',
    challenge: 'node-challenge',
    solution: 'node-solution',
    outcome: 'node-outcome'
  };
  const cls = typeMap[node.type] || 'node-outcome';
  const hasChildren = node.children && node.children.length > 0;

  return `
    <div class="tree-node">
      <div class="node-box ${cls}" onclick="handleNodeClick('${node.type}', this)">
        <span class="node-text">${node.label}</span>
        ${node.pts ? `<span class="node-pts">${node.pts}</span>` : ''}
      </div>
      ${hasChildren ? `<div class="tree-children">${node.children.map(ch => renderNode(ch, depth+1)).join('')}</div>` : ''}
    </div>
  `;
}

function renderTree(root) {
  document.getElementById('tree-wrap').innerHTML = renderNode(root);
}

function handleNodeClick(type, el) {
  el.style.outline = '2.5px solid #0066cc';
  el.style.outlineOffset = '2px';
  setTimeout(() => { el.style.outline = ''; el.style.outlineOffset = ''; }, 600);
  const typeToAction = {
    evidence: '📊 Share Evidence',
    hypothesis: '💡 Suggest an Idea',
    assumption: '⚠️ Challenge an Assumption',
    question: '🔍 Ask a Question',
    solution: '🧪 Suggest an Experiment',
    outcome: '🎯 Estimate Impact'
  };
  const action = typeToAction[type] || '🔍 Ask a Question';
  showToast(`Contribution linked to this node → ${action}`, '+25 pts');
}

// ── PALETTE ────────────────────────────────
function renderPalette() {
  const el = document.getElementById('palette-card');
  const actions = [
    { icon: '🔍', label: 'Ask a deeper question', pts: '+42 Insight Points', bg: 'rgba(124,58,237,0.08)' },
    { icon: '💡', label: 'Propose a solution', pts: '+28 Thinking Points', bg: 'rgba(0,102,204,0.07)' },
    { icon: '⚠️', label: 'Challenge an assumption', pts: '+31 Critical Thinking', bg: 'rgba(245,158,11,0.08)' },
    { icon: '📊', label: 'Add evidence', pts: '+18 Evidence Score', bg: 'rgba(16,185,129,0.08)' },
    { icon: '🔄', label: 'Link a similar experience', pts: '+19 Context Points', bg: 'rgba(239,68,68,0.07)' },
    { icon: '🧪', label: 'Suggest an experiment', pts: '+24 Thinking Points', bg: 'rgba(0,102,204,0.07)' },
    { icon: '🎯', label: 'Estimate impact', pts: '+15 Signal Points', bg: 'rgba(16,185,129,0.08)' }
  ];
  el.innerHTML = `
    <div class="palette-title">What's your most valuable move?</div>
    <div class="palette-sub">Every contribution advances the investigation.</div>
    <div class="palette-grid">
      ${actions.map(a => `
        <button class="palette-btn" onclick="contributeAction('${a.label}')">
          <div class="palette-icon" style="background:${a.bg}">${a.icon}</div>
          <div class="palette-btn-text">
            <span class="palette-btn-label">${a.label}</span>
            <span class="palette-btn-pts">${a.pts}</span>
          </div>
          <span class="palette-btn-arrow">→</span>
        </button>
      `).join('')}
    </div>
  `;
}

function contributeAction(action) {
  const ptsMap = {
    'Ask a deeper question': '+42 Insight Points',
    'Propose a solution': '+28 Thinking Points',
    'Challenge an assumption': '+31 Critical Thinking',
    'Add evidence': '+18 Evidence Score',
    'Link a similar experience': '+19 Context Points',
    'Suggest an experiment': '+24 Thinking Points',
    'Estimate impact': '+15 Signal Points'
  };
  const pts = ptsMap[action] || '+25 Points';
  showToast(`✔ Your ${action.toLowerCase()} was added`, pts);
}

// ── TENSION ────────────────────────────────
function renderTension(c) {
  const el = document.getElementById('tension-card');
  el.innerHTML = `
    <div class="tension-title">⚡ Community Divided</div>
    <div class="tension-question">${c.tension.question}</div>
    <div class="tension-bars">
      <div class="tension-bar-row">
        <span class="tension-bar-label" style="color:var(--accent)">${c.tension.a.label}</span>
        <div class="tension-bar-track"><div class="tension-bar-fill-a" style="width:${c.tension.a.pct}%"></div></div>
        <span class="tension-bar-pct" style="color:var(--accent)">${c.tension.a.pct}%</span>
      </div>
      <div class="tension-bar-row">
        <span class="tension-bar-label" style="color:var(--red)">${c.tension.b.label}</span>
        <div class="tension-bar-track"><div class="tension-bar-fill-b" style="width:${c.tension.b.pct}%"></div></div>
        <span class="tension-bar-pct" style="color:var(--red)">${c.tension.b.pct}%</span>
      </div>
    </div>
    <div class="tension-cta" onclick="contributeAction('Challenge an assumption')">Help decide →</div>
  `;
}

// ── LEADERS ────────────────────────────────
function renderLeaders(c) {
  const el = document.getElementById('leaders-card');
  el.innerHTML = `
    <div class="leaders-title">🏆 Top Thinkers</div>
    ${c.leaders.map(l => `
      <div class="leader-row">
        <div class="leader-avatar" style="background:${l.color}">${l.initials}</div>
        <div class="leader-info">
          <div class="leader-name">${l.name}</div>
          <div class="leader-title">${l.title}</div>
        </div>
        <div class="leader-pts">
          <div class="leader-pts-val">${l.pts}</div>
          <span class="leader-pts-lbl">points</span>
        </div>
      </div>
    `).join('')}
  `;
}

// ── REACTIONS ──────────────────────────────
function renderReactions() {
  const el = document.getElementById('reactions-card');
  el.innerHTML = `
    <div class="reactions-title">Business Reactions</div>
    ${[
      ['❤️', 'Useful — this shaped our understanding', 8],
      ['🧠', 'Changed our thinking entirely', 4],
      ['🚀', 'We\'re already implementing this', 2],
      ['❌', 'Doesn\'t apply to our context', 1]
    ].map(([icon, text, count]) => `
      <div class="reaction-row" onclick="showToast('Reaction recorded', '✔')">
        <span class="reaction-icon">${icon}</span>
        <span class="reaction-text">${text}</span>
        <span class="reaction-count">${count}</span>
      </div>
    `).join('')}
  `;
}

// ── CONTRIBUTIONS ──────────────────────────
function renderContribs(c) {
  const el = document.getElementById('contrib-feed');
  el.innerHTML = `
    <div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px 0 4px">Recent contributions</div>
    ${c.contributions.map(ct => `
      <div class="contrib-item">
        <div class="contrib-header">
          <div class="contrib-avatar" style="background:${ct.color}">${ct.initials}</div>
          <div class="contrib-meta">
            <div class="contrib-name">${ct.name}</div>
            <div class="contrib-role">${ct.role}</div>
          </div>
          <span class="contrib-type-badge" style="background:${ct.typeBg};color:${ct.typeColor}">${ct.type}</span>
        </div>
        <div class="contrib-body">${ct.text}</div>
        <div class="contrib-footer">
          <span class="contrib-pts">✔ ${ct.pts}</span>
          <div class="contrib-reactions">
            <button class="contrib-react-btn" onclick="showToast('Marked useful', '✔')">❤️ Useful</button>
            <button class="contrib-react-btn" onclick="showToast('Marked as changed thinking', '🧠')">🧠 Changed thinking</button>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

// ───────────────────────────────────────────
// TOAST
// ───────────────────────────────────────────
let toastTimer = null;
function showToast(msg, pts) {
  const el = document.getElementById('toast');
  el.innerHTML = `${msg} <span class="toast-pts">${pts}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ───────────────────────────────────────────
// INIT
// ───────────────────────────────────────────
renderFeed();
</script>
</body>
